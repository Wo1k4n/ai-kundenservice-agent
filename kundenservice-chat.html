<!DOCTYPE html>
<html>
<head>
  <title>Kundenservice-Assistent</title>
</head>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #0d1117;
  font-family: sans-serif;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.chat-wrapper {
  width: 100%;
  max-width: 500px;
  background: #161b22;
  border-radius: 20px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  height: 600px;
}

.chat-header {
  background: #21262d;
  padding: 20px;
  color: #e6edf3;
  font-size: 20px;
  font-weight: bold;
  text-align: center;
}

.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.msg {
  max-width: 80%;
  padding: 12px 16px;
  border-radius: 18px;
  font-size: 15px;
  line-height: 1.5;
  white-space: pre-wrap;
}

.msg.bot {
  background: #21262d;
  color: #e6edf3;
  align-self: flex-start;
  border-bottom-left-radius: 4px;
}

.msg.user {
  background: #58a6ff;
  color: #0d1117;
  align-self: flex-end;
  border-bottom-right-radius: 4px;
}

.typing {
  background: #21262d;
  color: #e6edf3;
  padding: 12px 16px;
  border-radius: 18px;
  border-bottom-left-radius: 4px;
  align-self: flex-start;
  font-size: 20px;
  letter-spacing: 4px;
}

.chat-input {
  display: flex;
  gap: 10px;
  padding: 16px;
  background: #0d1117;
}

.chat-input input {
  flex: 1;
  padding: 12px 16px;
  border-radius: 30px;
  border: none;
  background: #21262d;
  color: #e6edf3;
  font-size: 15px;
  outline: none;
}

.chat-input input::placeholder {
  color: #7d8590;
}

.chat-input button {
  padding: 12px 20px;
  border-radius: 30px;
  border: none;
  background: #58a6ff;
  color: #0d1117;
  font-weight: bold;
  cursor: pointer;
  font-size: 15px;
}
</style>

<body>
  <div class="chat-wrapper">
    <div class="chat-header">Kundenservice-Assistent</div>
    <div class="chat-messages" id="messages">
      <div class="msg bot">Hallo! Ich helfe dir gern bei Fragen zu deiner Bestellung.</div>
    </div>
    <div class="chat-input">
      <input id="eingabe" placeholder="Schreib eine Nachricht..." onkeydown="if(event.key==='Enter')senden()">
      <button onclick="senden()">Senden</button>
    </div>
  </div>

  <script>
// Trag hier deine eigene Chat Trigger Webhook-URL aus n8n ein
const WEBHOOK_URL = "http://localhost:5678/webhook/5ab6dad6-c1ea-4e88-a170-2b388b53a626/chat";

// n8n's Chat Trigger braucht eine sessionId, damit Memory pro Konversation funktioniert
const sessionId = "session-" + Date.now() + "-" + Math.random().toString(36).substring(2, 9);

async function senden() {
  const input = document.getElementById("eingabe");
  const text = input.value.trim();
  if (!text) return;

  const messages = document.getElementById("messages");

  const userMsg = document.createElement("div");
  userMsg.className = "msg user";
  userMsg.innerText = text;
  messages.appendChild(userMsg);
  input.value = "";

  const typing = document.createElement("div");
  typing.className = "typing";
  typing.innerText = "...";
  messages.appendChild(typing);
  messages.scrollTop = messages.scrollHeight;

  try {
    const res = await fetch(WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        chatInput: text,
        sessionId: sessionId
      })
    });
    const data = await res.json();
    typing.remove();

    const botMsg = document.createElement("div");
    botMsg.className = "msg bot";
    botMsg.innerText = data.output || data.text || JSON.stringify(data);
    messages.appendChild(botMsg);
  } catch(e) {
    typing.remove();
    const err = document.createElement("div");
    err.className = "msg bot";
    err.innerText = "Fehler – bitte prüf die Webhook URL.";
    messages.appendChild(err);
  }

  messages.scrollTop = messages.scrollHeight;
}
  </script>
</body>
</html>
